name: CI/CD Pipeline

on:
  push:
    branches: [master, prueba-dev-ops, test-usuario-funcines]
  pull_request:
    branches: [master, prueba-dev-ops, test-usuario-funcines]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # ── JOB 1: Lint, test y build ──────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    services:                     
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user      
          POSTGRES_PASSWORD: test_pass    
          POSTGRES_DB: test_db           
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_SSL: 'false'

      - name: Build de Astro
        run: npm run build

  # ── JOB 2: Tests E2E (Playwright) ──────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci                          # solo corre si lint/build/tests pasaron

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr tests E2E
        run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_SSL: 'false'
          CI: 'true'

      - name: Subir reporte de Playwright si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── JOB 3: Deploy a Vercel (solo en push a main) ───────────────────────
  deploy:
    name: Deploy a Vercel
    runs-on: ubuntu-latest
    needs: [ci, e2e]                   # solo corre si build/tests Y e2e pasaron
    if: if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/prueba-dev-ops') && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Deploy a producción
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}