name: CI/CD Pipeline

on:
  push:
    branches: [main, prueba-dev-ops]   # ✅ agregado prueba-dev-ops
  pull_request:
    branches: [main, prueba-dev-ops]

jobs:
  # ── JOB 1: Lint, test y build ──────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test
        env:
          # ✅ Variables de entorno cargadas desde GitHub Secrets
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build de Astro
        run: npm run build

  # ── JOB 2: Deploy a Vercel (solo en push a main) ───────────────────────
  deploy:
    name: Deploy a Vercel
    runs-on: ubuntu-latest
    needs: ci                          # Solo corre si el job "ci" pasó
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias        # ✅ faltaba esto
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Deploy a producción
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}